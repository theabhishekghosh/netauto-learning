policy-options {
    policy-statement NHS {
        from {
            protocol bgp;
            route-type external;
        }
        then {
            next-hop self;
        }
    }
    policy-statement bgp_to_ospf {
        from protocol bgp;
        then accept;
    }
    policy-statement ospf_to_bgp {
        from protocol ospf;
        then accept;
    }
}
routing-instances {
    L3VPN_CUST {
        instance-type vrf;
        protocols {
            ospf {
                area 0.0.0.1 {
                    interface ge-0/0/1.0;
                }
                export [ ospf_to_bgp bgp_to_ospf ];
            }
        }
        interface ge-0/0/1.0;
        route-distinguisher 7.7.7.7:200;
        vrf-target target:54001:200;
    }
}
routing-options {
    router-id 7.7.7.7;
    autonomous-system 65001;
    srlg {
        srlg-dark {
            srlg-value 101;
            srlg-cost 1;
        }
    }
}
protocols {
    bgp {
        group internal {
            family inet {
                unicast;
            }
            family inet-vpn {
                unicast;
            }
            export [ NHS bgp_to_ospf ];
            neighbor 4.4.4.4 {
                local-address 7.7.7.7;
                peer-as 65001;
            }
        }
    }
    mpls {
        admin-groups {
            vendor-Green 1;
            vendor-Orange 2;
        }
        label-switched-path TO_RR {
            to 4.4.4.4;
        }
        label-switched-path TH.PE2_to_HEX.PE2 {
            to 1.1.1.1;
            revert-timer 120;
            node-link-protection;
            adaptive;
            primary to_pe1_pri;
            secondary to_pe1_sec {
                admin-group exclude vendor-Green;
                standby;
            }
        }
        path to_pe1_pri {
            6.6.6.6 strict;
        }
        path to_pe1_sec {
            2.2.2.2 strict;
        }
        interface ge-0/0/0.0;
        interface ge-0/0/2.0 {
            srlg srlg-dark;
            admin-group vendor-Green;
        }
    }
    ospf {
        traffic-engineering;
        area 0.0.0.0 {
            interface lo0.0;
            interface ge-0/0/0.0;
            interface ge-0/0/2.0;
        }
    }
    rsvp {
        interface all {
            link-protection;
        }
        interface ge-0/0/0.0 {
            link-protection;
        }
        interface ge-0/0/2.0 {
            link-protection {
                exclude-srlg;
            }
        }
    }
}
