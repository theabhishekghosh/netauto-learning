policy-options {
    policy-statement NHS {
        from {
            protocol bgp;
            route-type external;
        }
        then {
            next-hop self;
        }
    }
}
routing-options {
    router-id 3.3.3.3;
    autonomous-system 65001;
}
protocols {
    bgp {
        group internal {
            family inet-vpn {
                unicast;
            }
            export NHS;
            neighbor 4.4.4.4 {
                local-address 3.3.3.3;
                peer-as 65001;
            }
        }
    }
    mpls {
        interface ge-0/0/0.0;
        interface ge-0/0/1.0;
    }
    ospf {
        traffic-engineering;
        area 0.0.0.0 {
            interface ge-0/0/0.0;
            interface ge-0/0/1.0;
            interface ge-0/0/2.0;
            interface lo0.0;
        }
    }
    rsvp {
        interface all;
        interface ge-0/0/0.0 {
            link-protection;
        }
        interface ge-0/0/1.0 {
            link-protection;
        }
    }
}

